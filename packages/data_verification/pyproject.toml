[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-verification"
version = "0.1.0"
description = "Offline RDF/OWL + SHACL verification of LeRobot datasets (object pose coverage)."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyarrow",
    "pyshacl>=0.30",
    "rdflib>=7.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_verification = ["ontology/*.ttl", "shapes/*.ttl", "templates/*.ttl"]
